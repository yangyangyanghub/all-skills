<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1440px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#0a0e27;color:#fff}
.slide{width:1080px;height:1440px;position:absolute;top:0;left:0;display:flex;flex-direction:column;background:linear-gradient(180deg, #0a0e27 0%, #111638 50%, #0d1230 100%);opacity:0;transition:opacity 0.4s ease-in-out}
.slide.active{opacity:1;z-index:10}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
.glow{position:absolute;top:-100px;right:-100px;width:500px;height:500px;border-radius:50%;pointer-events:none}
.top-area{height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 60px 16px;gap:12px;position:relative;z-index:2}
.date-line{font-size:22px;font-weight:400;color:rgba(255,255,255,0.4);letter-spacing:0.08em}
.cat-row{display:flex;align-items:center;gap:12px}
.badge{display:inline-block;font-size:13px;font-weight:600;padding:5px 16px;border-radius:14px;border:1px solid;letter-spacing:0.04em}
.divider{width:40px;height:2px;background:#818cf8;border-radius:2px;opacity:0.5}
.list-area{flex:1;display:flex;flex-direction:column;justify-content:center;padding:8px 60px 10px;position:relative;z-index:2}
.list-item{display:flex;align-items:flex-start;gap:14px;padding:12px 18px;margin-bottom:5px;border-radius:10px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05);animation:fadeInUp 0.45s ease-out both;opacity:0}
@keyframes fadeInUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.item-num{font-size:18px;font-weight:800;min-width:32px;text-align:center;padding-top:2px;flex-shrink:0}
.item-body{flex:1;min-width:0}
.item-title{font-size:22px;font-weight:700;line-height:1.3;color:#fff;margin-bottom:3px}
.item-summary{font-size:15px;line-height:1.4;color:rgba(255,255,255,0.6)}
.kw{color:#22d3ee;font-weight:600}
.kw-num{color:#4ade80;font-weight:700}
.bottom-area{height:80px;display:flex;align-items:center;justify-content:center;position:relative;z-index:2;padding-bottom:20px}
.page-dots{display:flex;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.15);transition:background 0.3s}
.dot.active{box-shadow:0 0 6px currentColor}
</style></head><body>
<div id="brief-root" data-composition-id="brief" data-width="1080" data-height="1440">
<div class="slide" id="slide-0">  <div class="grid-bg"></div>  <div class="glow" style="background:radial-gradient(circle,#6366f108 0%,transparent 60%)"></div>  <div class="top-area">    <div class="date-line">2026年10月16日</div>    <div class="cat-row">      <span class="badge" style="background:#6366f122;border-color:#6366f144;color:#6366f1">大模型进展</span>    </div>    <div class="divider"></div>  </div>  <div class="list-area"><div class="list-item" style="animation-delay:0.00s">  <div class="item-num" style="color:#6366f1">01</div>  <div class="item-body">    <div class="item-title">某团队发布新一代推理模型</div>    <div class="item-summary">新模型在数学推理与代码生成任务上提升明显，开放了权重。</div>  </div></div><div class="list-item" style="animation-delay:0.08s">  <div class="item-num" style="color:#6366f1">02</div>  <div class="item-body">    <div class="item-title">开源社区推出轻量 Agent 框架</div>    <div class="item-summary">该框架主打轻量与易用，几行代码即可接入工具调用。</div>  </div></div></div>  <div class="bottom-area">    <div class="page-dots"><span class="dot active" style="background:#6366f1"></span><span class="dot"></span></div>  </div></div>
<div class="slide" id="slide-1">  <div class="grid-bg"></div>  <div class="glow" style="background:radial-gradient(circle,#6366f108 0%,transparent 60%)"></div>  <div class="top-area">    <div class="date-line">2026年10月16日</div>    <div class="cat-row">      <span class="badge" style="background:#6366f122;border-color:#6366f144;color:#6366f1">行业动态</span>    </div>    <div class="divider"></div>  </div>  <div class="list-area"><div class="list-item" style="animation-delay:0.00s">  <div class="item-num" style="color:#6366f1">01</div>  <div class="item-body">    <div class="item-title">遥感影像解译精度提升</div>    <div class="item-summary">新方法在城区复杂场景下的分类精度明显改善。</div>  </div></div></div>  <div class="bottom-area">    <div class="page-dots"><span class="dot"></span><span class="dot active" style="background:#6366f1"></span></div>  </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script>
(function(){
var totalSlides = 2;
var slideDur = 3.5;
var fadeDur = 0.4;

function showSlide(idx){
  for(var i=0;i<totalSlides;i++){
    var el = document.getElementById("slide-"+i);
    if(!el) continue;
    if(i===idx) el.classList.add("active");
    else el.classList.remove("active");
  }
}

var tl = gsap.timeline({paused:true});
for(var i=0;i<totalSlides;i++){
  (function(idx){
    if(idx===0){
      tl.call(function(){showSlide(0);}, [], ">", 0);
    } else {
      tl.call(function(){showSlide(idx);}, [], ">", 0);
      tl.to({}, {duration: fadeDur}, ">");
    }
    if(idx < totalSlides - 1){
      tl.to({}, {duration: slideDur - fadeDur}, ">");
    }
  })(i);
}
tl.to({}, {duration: slideDur}, ">");

window.__timelines = window.__timelines || {};
window.__timelines["brief"] = tl;
})();
</script>
</body></html>
