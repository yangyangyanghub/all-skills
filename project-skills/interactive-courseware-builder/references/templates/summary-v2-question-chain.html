<!--
  summary-v2-question-chain.html — V2·链式问题驱动总结页模板
  使用方式：Step 3 选中V2后，将以下CSS+HTML+JS复制到课件中。
  
  结构：核心问题(点击)→答案翻牌卡片(翻面看详解)→引出下一个问题→链条总览
  适用：数学定理推导、实验探究、历史因果、编程算法等因果链知识。

  ⚠ 颜色变量：全部使用 color-schemes.md 标准变量（--primary/--paper/--line/--accent 等），
  不依赖任何自定义颜色变量。复制时无需改动。
-->

<style>
/* V2 问题链总结页 CSS（复制到课件 <style>） */
.summary-v2-chain{display:flex;flex-direction:column;align-items:center;width:100%}
.summary-v2-qblock{width:100%;text-align:center}
.summary-v2-question{cursor:pointer;background:#fff;border:2px solid var(--line);border-radius:18px;padding:24px 32px;font-size:24px;font-weight:700;color:var(--primary);transition:all .3s;display:inline-block;min-width:500px;margin:0 auto}
.summary-v2-question:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.1)}
.summary-v2-question.revealed{background:var(--primary);color:#fff;border-color:var(--primary);cursor:default;pointer-events:none}
.summary-v2-qicon{display:inline-block;width:32px;height:32px;line-height:32px;border-radius:50%;background:rgba(0,0,0,.1);color:var(--primary);font-size:20px;font-weight:500;margin-right:8px}
.summary-v2-question.revealed .summary-v2-qicon{background:rgba(255,255,255,.25);color:#fff}
.summary-v2-cards-wrap{max-height:0;overflow:hidden;transition:max-height .6s ease}
.summary-v2-cards-wrap.show{max-height:1000px;margin-top:20px}
.summary-v2-cards-row{display:flex;justify-content:center;gap:20px;flex-wrap:wrap}
.summary-v2-flip{perspective:600px;width:300px;height:150px;cursor:pointer;animation:popIn .4s ease backwards}
.summary-v2-flip:nth-child(1){animation-delay:0s}
.summary-v2-flip:nth-child(2){animation-delay:.1s}
.summary-v2-flip:nth-child(3){animation-delay:.2s}
.summary-v2-flip-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.summary-v2-flip.flipped .summary-v2-flip-inner{transform:rotateY(180deg)}
.summary-v2-flip-front,.summary-v2-flip-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:16px;display:flex;align-items:center;justify-content:center;padding:20px 22px;font-size:20px;line-height:1.7}
.summary-v2-flip-front{background:var(--paper-2);border:2px solid var(--line);color:var(--primary);font-weight:700;flex-direction:column;text-align:center}
.summary-v2-flip-front .flip-hint{font-size:14px;color:var(--primary-light);font-weight:400;margin-top:6px}
.summary-v2-flip-back{background:#fff;border:2px solid var(--primary);color:var(--ink);font-size:20px;text-align:left;transform:rotateY(180deg);overflow-y:auto;padding:18px 20px}
.summary-v2-conn{height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.summary-v2-conn-line{width:2px;flex:1;background:var(--line)}
.summary-v2-conn-dot{width:10px;height:10px;border-radius:50%;background:var(--primary);opacity:.5}
.summary-v2-summary{display:none;margin-top:40px;padding:28px 36px;background:var(--paper-2);border-radius:18px;text-align:center;width:100%}
.summary-v2-summary.show{display:block}
.summary-v2-summary h3{font-size:24px;font-weight:700;color:var(--primary);margin-bottom:16px}
.summary-v2-flow{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;font-size:20px}
.summary-v2-flow span{padding:12px 20px;background:#fff;border-radius:24px;border:1px solid var(--line)}
.summary-v2-hint{font-size:18px;color:var(--primary-light);margin-top:16px;text-align:center}
@keyframes popIn{from{opacity:0;transform:translateY(12px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
</style>

<!-- V2 问题链 HTML skeleton（复制到总结页 <section>） -->
<div class="summary-v2-chain" id="v2chain">
  <!--
  问题块模板（复制N份，N=问题数）：
  <div class="summary-v2-qblock">
    <div class="summary-v2-question" id="v2q1" onclick="revealV2(1)">
      <span class="summary-v2-qicon">1</span><!-- 问题文本 -->
    </div>
    <div class="summary-v2-cards-wrap" id="v2a1">
      <div class="summary-v2-cards-row">
        <div class="summary-v2-flip" onclick="event.stopPropagation();this.classList.toggle('flipped')">
          <div class="summary-v2-flip-inner">
            <div class="summary-v2-flip-front"><!-- 要点标题 --><span class="flip-hint">点击翻面</span></div>
            <div class="summary-v2-flip-back"><!-- 详细解释 --></div>
          </div>
        </div>
        <!-- 更多翻牌卡片... -->
      </div>
    </div>
  </div>
  <div class="summary-v2-conn" id="v2c1" style="display:none"><div class="summary-v2-conn-line"></div><div class="summary-v2-conn-dot"></div></div>
  -->

  <div class="summary-v2-summary" id="v2ChainSummary">
    <h3>知识链条总览</h3>
    <div class="summary-v2-flow"><!-- 链条节点span --></div>
  </div>
</div>
<div class="summary-v2-hint">点击问题框揭示答案卡片 · 点击卡片翻面看详解</div>

<!-- V2 JS（复制到课件 <script>，替换 TOTAL 和显示逻辑） -->
<script>
var v2Total=5, v2Step=0;
function revealV2(n){if(n!==v2Step+1)return;v2Step=n;var q=document.getElementById('v2q'+n),a=document.getElementById('v2a'+n);q.classList.add('revealed');a.classList.add('show');if(n<v2Total){document.getElementById('v2c'+n).style.display='';document.getElementById('v2q'+(n+1)).style.display='inline-block'}else{for(var i=1;i<v2Total;i++)document.getElementById('v2c'+i).style.display='';document.getElementById('v2ChainSummary').classList.add('show')}}
</script>
