<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>封面 - 5个职场效率AI工具推荐</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #000;
}
.slide-content {
  width: 720px;
  height: 960px;
  position: relative;
  transform-origin: center center;
}
</style>
<script>
function scaleSlide() {
  var slide = document.querySelector('.slide-content');
  if (!slide) return;
  var slideWidth = 720;
  var slideHeight = 960;
  var scaleX = window.innerWidth / slideWidth;
  var scaleY = window.innerHeight / slideHeight;
  var scale = Math.min(scaleX, scaleY);
  slide.style.width = slideWidth + 'px';
  slide.style.height = slideHeight + 'px';
  slide.style.transform = 'scale(' + scale + ')';
  slide.style.transformOrigin = 'center center';
  slide.style.flexShrink = '0';
}
window.addEventListener('load', scaleSlide);
window.addEventListener('resize', scaleSlide);
</script>
</head>
<body>

<div class="slide-content" style="background:#ffffff;">

  <!-- 顶部装饰条 - 薄荷色 -->
  <svg width="720" height="8" style="position:absolute;top:0;left:0;" aria-hidden="true">
    <rect width="720" height="8" fill="#2ec4b6"/>
  </svg>

  <!-- 底部装饰条 - 橙色 -->
  <svg width="720" height="8" style="position:absolute;bottom:0;left:0;" aria-hidden="true">
    <rect width="720" height="8" fill="#ff9f1c"/>
  </svg>

  <!-- 背景装饰圆点 - 薄荷浅色 -->
  <svg width="100%" height="100%" style="position:absolute;top:0;left:0;opacity:0.06;pointer-events:none;" aria-hidden="true">
    <defs>
      <pattern id="dots-cover" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
        <circle cx="30" cy="30" r="3" fill="#2ec4b6"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#dots-cover)"/>
  </svg>

  <!-- 左下角装饰方块 -->
  <svg width="80" height="80" style="position:absolute;left:48px;bottom:120px;opacity:0.15;" aria-hidden="true">
    <rect width="80" height="80" rx="12" fill="#ffbf69"/>
  </svg>

  <!-- 右上角装饰方块 -->
  <svg width="60" height="60" style="position:absolute;right:56px;top:120px;opacity:0.12;" aria-hidden="true">
    <rect width="60" height="60" rx="10" fill="#2ec4b6"/>
  </svg>

  <!-- 主视觉占位区 -->
  <div style="position:absolute;left:110px;top:80px;width:500px;height:300px;background:#cbf3f0;border-radius:16px;display:flex;align-items:center;justify-content:center;">
    <!-- 占位图标：效率工具组合 SVG -->
    <svg width="120" height="120" viewBox="0 0 120 120" fill="none" aria-hidden="true">
      <!-- 闪电符号 -->
      <path d="M70 10 L35 65 L58 65 L50 110 L85 55 L62 55 Z" fill="#2ec4b6" opacity="0.5"/>
      <!-- 齿轮外圈 -->
      <circle cx="90" cy="90" r="22" stroke="#ff9f1c" stroke-width="4" fill="none" opacity="0.6"/>
      <circle cx="90" cy="90" r="10" stroke="#ff9f1c" stroke-width="3" fill="none" opacity="0.6"/>
      <!-- 文档图标 -->
      <rect x="15" y="75" width="30" height="36" rx="3" fill="#ff9f1c" opacity="0.4"/>
      <line x1="21" y1="85" x2="38" y2="85" stroke="#ffffff" stroke-width="2"/>
      <line x1="21" y1="92" x2="38" y2="92" stroke="#ffffff" stroke-width="2"/>
      <line x1="21" y1="99" x2="33" y2="99" stroke="#ffffff" stroke-width="2"/>
    </svg>
  </div>

  <!-- 标签 - SVG badge -->
  <svg width="200" height="44" viewBox="0 0 200 44" style="position:absolute;left:260px;top:400px;">
    <rect width="200" height="44" rx="22" fill="#ff9f1c"/>
    <text x="100" y="22" text-anchor="middle" dominant-baseline="central"
          font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="16" font-weight="600" fill="#ffffff">职场效率提升指南</text>
  </svg>

  <!-- 主标题 -->
  <h1 style="position:absolute;left:60px;top:480px;width:600px;margin:0;
             font-family:'Noto Serif SC','Times New Roman','SimSun',serif;
             font-size:52px;font-weight:800;color:#2b2b2b;text-align:center;line-height:1.3;">
    5个职场效率<br/>AI工具推荐
  </h1>

  <!-- 副标题 -->
  <p style="position:absolute;left:60px;top:640px;width:600px;margin:0;
            font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
            font-size:20px;font-weight:400;color:#666666;text-align:center;line-height:1.6;">
    让AI帮你省下每天2小时的重复劳动
  </p>

  <!-- 分隔线 -->
  <svg width="80" height="3" aria-hidden="true" style="position:absolute;left:320px;top:700px;">
    <rect width="80" height="3" rx="1.5" fill="#2ec4b6"/>
  </svg>

  <!-- 底部信息 -->
  <p style="position:absolute;left:60px;top:740px;width:600px;margin:0;
            font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
            font-size:14px;font-weight:400;color:#999999;text-align:center;">
    2026 · AI 工具精选合集
  </p>

</div>

</body>
</html>
