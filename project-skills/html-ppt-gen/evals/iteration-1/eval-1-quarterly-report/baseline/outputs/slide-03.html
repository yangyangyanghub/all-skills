<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q2 季度业务汇报 - 月度销售趋势</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0f1a2e;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh;
  }

  .slide {
    width: 1280px; height: 720px;
    background: linear-gradient(160deg, #0a1628 0%, #14264b 35%, #1a365d 65%, #0f2440 100%);
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    border-radius: 4px;
    display: flex;
  }

  .deco-line {
    position: absolute; top: 0; left: 0;
    width: 4px; height: 100%;
    background: linear-gradient(180deg, #ed8936 0%, #dd6b20 50%, #c05621 100%);
  }
  .deco-dot {
    position: absolute; top: 100px; right: 120px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(237,137,54,0.4);
  }

  /* 左侧标题区 */
  .section-header {
    width: 260px;
    padding: 60px 0 0 80px;
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
  }
  .section-num {
    font-size: 64px; font-weight: 800;
    color: rgba(237,137,54,0.2);
    line-height: 1;
    margin-bottom: 8px;
    font-variant-numeric: tabular-nums;
  }
  .section-title {
    font-size: 28px; font-weight: 700;
    color: #ffffff;
    line-height: 1.4;
    letter-spacing: 2px;
  }
  .section-title .accent {
    color: #f6ad55;
  }
  .section-divider {
    width: 30px; height: 3px;
    background: #ed8936;
    margin-top: 20px;
  }

  /* 右侧主内容区 */
  .main-area {
    flex: 1;
    padding: 50px 80px 40px 30px;
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    justify-content: center;
  }

  /* KPI 指标卡 */
  .kpi-row {
    display: flex; gap: 20px;
    margin-bottom: 30px;
  }
  .kpi-card {
    flex: 1;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 6px;
    padding: 18px 22px;
    text-align: center;
  }
  .kpi-label {
    font-size: 12px; color: rgba(255,255,255,0.45);
    letter-spacing: 2px;
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .kpi-value {
    font-size: 28px; font-weight: 700;
    color: #ffffff;
    letter-spacing: 1px;
  }
  .kpi-value .unit {
    font-size: 14px; font-weight: 400;
    color: rgba(255,255,255,0.5);
    margin-left: 2px;
  }
  .kpi-change {
    font-size: 12px; margin-top: 6px;
    font-weight: 500;
  }
  .kpi-change.up { color: #48bb78; }
  .kpi-card.accent {
    border-color: rgba(237,137,54,0.25);
    background: rgba(237,137,54,0.06);
  }

  /* SVG 图表区域 */
  .chart-area {
    flex: 1;
    display: flex; align-items: flex-end;
    justify-content: center;
    min-height: 300px;
  }

  .chart-area svg {
    width: 100%;
    max-width: 600px;
  }

  .insight-bar {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px;
    background: rgba(72,187,120,0.08);
    border-left: 3px solid #48bb78;
    border-radius: 0 4px 4px 0;
    margin-top: 20px;
  }
  .insight-bar .insight-icon {
    font-size: 18px;
  }
  .insight-bar .insight-text {
    font-size: 13px; color: rgba(255,255,255,0.7);
    letter-spacing: 0.5px;
  }
  .insight-bar .insight-highlight {
    color: #48bb78; font-weight: 600;
  }

  .page-num {
    position: absolute; bottom: 50px; right: 80px;
    font-size: 12px; color: rgba(255,255,255,0.25);
    letter-spacing: 2px;
    z-index: 1;
  }
</style>
</head>
<body>
<div class="slide">
  <div class="deco-line"></div>
  <div class="deco-dot"></div>

  <div class="section-header">
    <div class="section-num">02</div>
    <div class="section-title">月度<span class="accent">销售</span><br>趋势分析</div>
    <div class="section-divider"></div>
  </div>

  <div class="main-area">
    <div class="kpi-row">
      <div class="kpi-card accent">
        <div class="kpi-label">Q2 总营收</div>
        <div class="kpi-value">4,680<span class="unit">万</span></div>
        <div class="kpi-change up">▲ +18.6% 同比增长</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">6月营收</div>
        <div class="kpi-value">1,840<span class="unit">万</span></div>
        <div class="kpi-change up">▲ +17.9% 环比</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">目标达成率</div>
        <div class="kpi-value">108<span class="unit">%</span></div>
        <div class="kpi-change up">▲ 超目标 8%</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">月均增长率</div>
        <div class="kpi-value">19.8<span class="unit">%</span></div>
        <div class="kpi-change up">▲ 持续增长</div>
      </div>
    </div>

    <div class="chart-area">
      <svg viewBox="0 0 600 280" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f6ad55" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#dd6b20" stop-opacity="0.6"/>
          </linearGradient>
          <linearGradient id="barGrad2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ed8936" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#c05621" stop-opacity="0.6"/>
          </linearGradient>
          <linearGradient id="barGrad3" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fbd38d" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#ed8936" stop-opacity="0.7"/>
          </linearGradient>
          <filter id="glow">
            <feGaussianBlur stdDeviation="2" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <!-- Y 轴网格线 -->
        <line x1="60" y1="30" x2="580" y2="30" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <line x1="60" y1="80" x2="580" y2="80" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <line x1="60" y1="130" x2="580" y2="130" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <line x1="60" y1="180" x2="580" y2="180" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <line x1="60" y1="230" x2="580" y2="230" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

        <!-- X 轴 -->
        <line x1="60" y1="250" x2="580" y2="250" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

        <!-- Y 轴标签 -->
        <text x="55" y="235" text-anchor="end" fill="rgba(255,255,255,0.3)" font-size="11" font-family="inherit">0</text>
        <text x="55" y="185" text-anchor="end" fill="rgba(255,255,255,0.3)" font-size="11" font-family="inherit">500万</text>
        <text x="55" y="135" text-anchor="end" fill="rgba(255,255,255,0.3)" font-size="11" font-family="inherit">1000万</text>
        <text x="55" y="85" text-anchor="end" fill="rgba(255,255,255,0.3)" font-size="11" font-family="inherit">1500万</text>
        <text x="55" y="35" text-anchor="end" fill="rgba(255,255,255,0.3)" font-size="11" font-family="inherit">2000万</text>

        <!-- 柱状图 - 4月 -->
        <rect x="120" y="130" width="100" height="120" rx="4" fill="url(#barGrad)" filter="url(#glow)"/>
        <text x="170" y="120" text-anchor="middle" fill="#f6ad55" font-size="14" font-weight="700" font-family="inherit">¥1,280万</text>
        <text x="170" y="270" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="13" font-family="inherit">4月</text>

        <!-- 柱状图 - 5月 -->
        <rect x="250" y="92" width="100" height="158" rx="4" fill="url(#barGrad2)" filter="url(#glow)"/>
        <text x="300" y="82" text-anchor="middle" fill="#ed8936" font-size="14" font-weight="700" font-family="inherit">¥1,560万</text>
        <text x="300" y="270" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="13" font-family="inherit">5月</text>

        <!-- 柱状图 - 6月 -->
        <rect x="380" y="63" width="100" height="187" rx="4" fill="url(#barGrad3)" filter="url(#glow)"/>
        <text x="430" y="53" text-anchor="middle" fill="#fbd38d" font-size="14" font-weight="700" font-family="inherit">¥1,840万</text>
        <text x="430" y="270" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="13" font-family="inherit">6月</text>

        <!-- 趋势线 -->
        <polyline points="170,115 300,76 430,48" fill="none" stroke="#ed8936" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>

        <!-- 目标线 -->
        <line x1="60" y1="60" x2="580" y2="60" stroke="rgba(72,187,120,0.4)" stroke-width="1.5" stroke-dasharray="8,4"/>
        <text x="585" y="63" fill="#48bb78" font-size="10" font-family="inherit" opacity="0.8">目标 ¥1,500万</text>
      </svg>
    </div>

    <div class="insight-bar">
      <span class="insight-icon">💡</span>
      <span class="insight-text">
        核心洞察：6月营收 <span class="insight-highlight">¥1,840万</span> 创单月历史新高，Q2 累计超目标 <span class="insight-highlight">8%</span>，三条核心产品线均实现双位数增长。
      </span>
    </div>
  </div>

  <div class="page-num">03 / 08</div>
</div>
</body>
</html>
