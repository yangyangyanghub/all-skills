<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 时代多任务并行开发 v2</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #1a1a1a;
      color: #fff;
      overflow: hidden;
    }
    
    .presentation-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .slide-frame {
      flex: 1;
      border: none;
      background: #000;
    }
    
    .nav-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      background: #2a2a2a;
      border-top: 1px solid #3a3a3a;
    }
    
    .nav-btn {
      padding: 8px 16px;
      background: #3a3a3a;
      color: #fff;
      border: 1px solid #4a4a4a;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    
    .nav-btn:hover {
      background: #4a4a4a;
      border-color: #5a5a5a;
    }
    
    .nav-btn.active {
      background: #0070F3;
      border-color: #0070F3;
    }
    
    .nav-info {
      color: #999;
      font-size: 14px;
      margin-left: 16px;
    }
    
    .nav-arrow {
      padding: 8px 12px;
      background: #3a3a3a;
      color: #fff;
      border: 1px solid #4a4a4a;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    
    .nav-arrow:hover {
      background: #4a4a4a;
    }
  </style>
</head>
<body>
  <div class="presentation-container">
    <iframe id="slideFrame" class="slide-frame" src="slide-01.html"></iframe>
    <div class="nav-bar">
      <button class="nav-arrow" onclick="prevSlide()">←</button>
      <div id="slideNav">
        <button class="nav-btn" onclick="loadSlide(1)">1</button>
      <button class="nav-btn" onclick="loadSlide(2)">2</button>
      <button class="nav-btn" onclick="loadSlide(3)">3</button>
      <button class="nav-btn" onclick="loadSlide(4)">4</button>
      <button class="nav-btn" onclick="loadSlide(5)">5</button>
      <button class="nav-btn" onclick="loadSlide(6)">6</button>
      <button class="nav-btn" onclick="loadSlide(7)">7</button>
      <button class="nav-btn" onclick="loadSlide(8)">8</button>
      <button class="nav-btn" onclick="loadSlide(9)">9</button>
      <button class="nav-btn" onclick="loadSlide(10)">10</button>
      <button class="nav-btn" onclick="loadSlide(11)">11</button>
      <button class="nav-btn" onclick="loadSlide(12)">12</button>
      <button class="nav-btn" onclick="loadSlide(13)">13</button>
      </div>
      <button class="nav-arrow" onclick="nextSlide()">→</button>
      <div class="nav-info">
        <span id="currentSlide">1</span> / <span id="totalSlides">13</span>
      </div>
    </div>
  </div>
  
  <script src="navigation.js"></script>
</body>
</html>
