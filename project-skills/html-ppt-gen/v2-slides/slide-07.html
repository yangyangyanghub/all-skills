<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>模块二续 — 构图/派活/合龙</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; display:flex; justify-content:center; align-items:center; background:#000; }
    .slide-content { width: 960px; height: 540px; position:relative; transform-origin:center center; }
  </style>
  <script>
    function scaleSlide() {
      var s = document.querySelector('.slide-content');
      if (!s) return;
      var sc = Math.min(window.innerWidth / 960, window.innerHeight / 540);
      s.style.width = '960px'; s.style.height = '540px';
      s.style.transform = 'scale(' + sc + ')';
      s.style.transformOrigin = 'center center'; s.style.flexShrink = '0';
    }
    window.addEventListener('load', scaleSlide);
    window.addEventListener('resize', scaleSlide);
  </script>
</head>
<body>
  <section class="slide">
    <div class="slide-content" style="width: 960px; height: 540px; background:#1a1b26;">
      <!-- 标题 -->
      <p style="position:absolute; left:60px; top:36px; margin:0; font-family:'Noto Serif SC','Times New Roman','SimSun',serif; font-size: 36px; font-weight:700; color:#a9b1d6;">
        有了任务图，并行的三件事
      </p>
      <svg width="60" height="3" style="position:absolute; left:60px; top:82px;" aria-hidden="true">
        <rect width="60" height="3" fill="#bb9af7"/>
      </svg>

      <!-- 构图 -->
      <svg width="260" height="260" viewBox="0 0 260 260" style="position:absolute; left:60px; top:120px;">
        <rect width="260" height="260" rx="8" fill="#24283b"/>
        <rect x="0" y="0" width="260" height="4" rx="2" fill="#7aa2f7"/>
        <svg x="20" y="20" width="36" height="36" viewBox="0 0 36 36">
          <circle cx="18" cy="18" r="18" fill="#7aa2f7"/>
          <text x="18" y="18" text-anchor="middle" dominant-baseline="central" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#1a1b26">1</text>
        </svg>
        <text x="66" y="44" font-family="'Noto Serif SC','Times New Roman','SimSun',serif" font-size="18" font-weight="700" fill="#a9b1d6">构图</text>
        <line x1="20" y1="62" x2="240" y2="62" stroke="#3b4261" stroke-width="1"/>
        <text x="20" y="88" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#9aa5ce">把任务画成图</text>
        <text x="20" y="112" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#9aa5ce">标出显性依赖（实线）</text>
        <text x="20" y="136" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#f7768e">和隐含依赖（红虚线）</text>
        <text x="20" y="170" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#565f89">找隐含依赖时，可以让</text>
        <text x="20" y="190" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#565f89">AI 帮你——把子任务清单</text>
        <text x="20" y="210" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#565f89">丢给 AI，问"哪些共享</text>
        <text x="20" y="230" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#565f89">契约可能冲突"</text>
      </svg>

      <!-- 派活 -->
      <svg width="260" height="260" viewBox="0 0 260 260" style="position:absolute; left:340px; top:120px;">
        <rect width="260" height="260" rx="8" fill="#24283b"/>
        <rect x="0" y="0" width="260" height="4" rx="2" fill="#bb9af7"/>
        <svg x="20" y="20" width="36" height="36" viewBox="0 0 36 36">
          <circle cx="18" cy="18" r="18" fill="#bb9af7"/>
          <text x="18" y="18" text-anchor="middle" dominant-baseline="central" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#1a1b26">2</text>
        </svg>
        <text x="66" y="44" font-family="'Noto Serif SC','Times New Roman','SimSun',serif" font-size="18" font-weight="700" fill="#a9b1d6">派活</text>
        <line x1="20" y1="62" x2="240" y2="62" stroke="#3b4261" stroke-width="1"/>
        <text x="20" y="88" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#9aa5ce">只把"没有入边"的</text>
        <text x="20" y="112" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#9aa5ce">节点派给 AI 并行</text>
        <text x="20" y="146" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#f7768e">有红虚线的</text>
        <text x="20" y="170" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#f7768e">先约定契约再并行</text>
        <text x="20" y="210" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#565f89">无入边 = 没有前置依赖</text>
        <text x="20" y="230" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#565f89">可以立刻开始</text>
      </svg>

      <!-- 合龙 -->
      <svg width="260" height="260" viewBox="0 0 260 260" style="position:absolute; left:620px; top:120px;">
        <rect width="260" height="260" rx="8" fill="#24283b"/>
        <rect x="0" y="0" width="260" height="4" rx="2" fill="#7aa2f7"/>
        <svg x="20" y="20" width="36" height="36" viewBox="0 0 36 36">
          <circle cx="18" cy="18" r="18" fill="#7aa2f7"/>
          <text x="18" y="18" text-anchor="middle" dominant-baseline="central" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#1a1b26">3</text>
        </svg>
        <text x="66" y="44" font-family="'Noto Serif SC','Times New Roman','SimSun',serif" font-size="18" font-weight="700" fill="#a9b1d6">合龙</text>
        <line x1="20" y1="62" x2="240" y2="62" stroke="#3b4261" stroke-width="1"/>
        <text x="20" y="88" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#9aa5ce">每完成一个节点</text>
        <text x="20" y="112" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#9aa5ce">更新任务图</text>
        <text x="20" y="146" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#9aa5ce">重新找"无入边"节点</text>
        <text x="20" y="180" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#565f89">并行是动态的</text>
        <text x="20" y="200" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#565f89">不是一次派完就不管了</text>
        <text x="20" y="236" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#565f89">完成 → 更新图 → 找新节点</text>
      </svg>

      <!-- 页码 -->
      <svg style="position:absolute; right:32px; bottom:24px;" width="36" height="36" viewBox="0 0 36 36">
        <circle cx="18" cy="18" r="18" fill="#bb9af7"/>
        <text x="18" y="18" text-anchor="middle" dominant-baseline="central" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#1a1b26">7</text>
      </svg>
    </div>
    <aside class="notes">
有了任务图，并行的三件事就变了：

**第一件：构图。** 把任务画成图，标出显性依赖（实线）和隐含依赖（红虚线）。**找隐含依赖时，可以让 AI 帮你**——把所有子任务清单丢给 AI，问"这些任务之间有哪些共享契约可能冲突"，它能看见你看不见的。

**第二件：派活。** 只把"没有入边"的节点派给 AI 并行。有红虚线的，先约定契约再并行。

**第三件：合龙。** 每完成一个节点，更新任务图，重新找"无入边"节点。并行是动态的，不是一次派完就不管了。

记住这个顺序：**构图 → 派活 → 合龙**。
    </aside>
  </section>
  <script src="../assets/runtime.js"></script>
</body>
</html>
