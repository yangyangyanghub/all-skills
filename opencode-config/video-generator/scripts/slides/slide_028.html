<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1440px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#0c0a1d;color:#fff}
.outro{width:1080px;height:1440px;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;overflow:hidden}
.glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,#6366f115 0%,transparent 60%);pointer-events:none}
.chk{width:72px;height:72px;border:3px solid #6366f1;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:28px;z-index:1}
.chk svg{width:36px;height:36px;stroke:#6366f1;fill:none}
.h1o{font-size:40px;font-weight:700;letter-spacing:0.04em;margin-bottom:10px;text-align:center;z-index:1;padding:0 40px}
.h2o{font-size:18px;color:rgba(255,255,255,0.4);letter-spacing:0.1em;z-index:1;padding:0 60px;text-align:center}
.dt{font-size:13px;color:rgba(255,255,255,0.2);margin-top:30px;z-index:1}
</style></head><body>
<div class="outro"><div class="glow"></div>
<div class="chk"><svg viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
<div class="h1o">感谢观看</div>
<div class="h2o">FunASR 语音识别工具包调研</div>
<div class="dt">2026-06-12</div>
</div>
</body></html>
