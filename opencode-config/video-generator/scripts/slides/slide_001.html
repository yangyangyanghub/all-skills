<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1440px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#0c0a1d;color:#fff}
.slide{width:1080px;height:1440px;position:relative;display:flex;flex-direction:column;background:linear-gradient(180deg,#0c0a1d 0%,#14102e 100%)}
.deco{position:absolute;top:-200px;right:-200px;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,#6366f115 0%,transparent 70%);pointer-events:none}

/* 上区：日期 + 分类 */
.top-area{height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 64px;gap:20px}
.date{font-size:28px;font-weight:400;color:rgba(255,255,255,0.5);letter-spacing:0.1em}
.cat-row{display:flex;align-items:center;gap:16px}
.badge{display:inline-block;background:#818cf822;color:#818cf8;font-size:15px;font-weight:600;padding:8px 20px;border-radius:20px;border:1px solid #818cf844;letter-spacing:0.05em}
.div{width:60px;height:3px;background:#6366f1;border-radius:2px}

/* 中区：内容展示 */
.middle-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 64px;gap:30px}
.title{font-size:44px;font-weight:800;line-height:1.3;letter-spacing:0.02em;color:#fff;text-align:center;max-width:950px}
.summary{font-size:24px;line-height:1.6;color:rgba(255,255,255,0.75);text-align:center;max-width:900px}
.media-area{width:100%;max-height:520px;display:flex;align-items:center;justify-content:center;border-radius:16px;overflow:hidden;background:rgba(0,0,0,0.3)}
.media-img{max-width:95%;max-height:500px;object-fit:contain;border-radius:12px}
.media-video{max-width:95%;max-height:500px;object-fit:contain;border-radius:12px}

/* 下区：字幕 + 来源 + 进度 */
.bottom-area{height:320px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 64px 40px;gap:20px}
.subtitle-box{width:100%;max-width:950px;min-height:80px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);border-radius:12px;padding:20px 30px}
.subtitle-text{font-size:26px;font-weight:500;color:#fff;text-align:center;line-height:1.5}
.source-row{width:100%;display:flex;justify-content:space-between;align-items:center;padding-top:20px;border-top:1px solid rgba(255,255,255,0.08)}
.source{font-size:15px;color:rgba(255,255,255,0.4)}
.cnt{font-size:14px;color:rgba(255,255,255,0.3)}
.prog{display:flex;justify-content:center;align-items:center;gap:0}
</style></head><body>
<div class="slide"><div class="deco"></div>

<!-- 上区 -->
<div class="top-area">
<div class="date">2026年6月8日</div>
<div class="cat-row"><span class="badge">AI 与智能化</span></div>
<div class="div"></div>
</div>

<!-- 中区 -->
<div class="middle-area">
<div class="title">Nex-AGI 开源 Nex-N2：基于 Qwen3.5 后训练的智能体模型</div>
<div class="summary">Nex-AGI 发布 Nex-N2-Pro 与 Nex-N2-mini，主打“智能体思维”，在复杂任务、终端智能体任务和浏览检索任务上表现突出。</div>

</div>

<!-- 下区 -->
<div class="bottom-area">
<div class="subtitle-box"><div class="subtitle-text" id="subtitle-text"></div></div>
<div class="source-row">
<span class="source">来源：魔搭ModelScope社区</span>
<span class="cnt">2 / 10</span>
</div>
<div class="prog"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.2);margin:0 4px"></span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#6366f1;margin:0 4px"></span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.2);margin:0 4px"></span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.2);margin:0 4px"></span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.2);margin:0 4px"></span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.2);margin:0 4px"></span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.2);margin:0 4px"></span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.2);margin:0 4px"></span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.2);margin:0 4px"></span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.2);margin:0 4px"></span></div>
</div>

</div></body></html>
