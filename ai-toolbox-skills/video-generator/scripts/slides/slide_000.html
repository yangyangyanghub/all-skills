<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1440px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#0c0a1d;color:#fff}
.intro{width:1080px;height:1440px;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;overflow:hidden}
.glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,#6366f120 0%,transparent 60%);pointer-events:none}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
.ib{width:80px;height:80px;border:2px solid #6366f166;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:32px;z-index:1}
.ib svg{width:36px;height:36px;stroke:#6366f1;fill:none}
.h1{font-size:46px;font-weight:800;letter-spacing:0.04em;margin-bottom:12px;text-align:center;z-index:1;padding:0 40px}
.h2{font-size:20px;font-weight:400;color:rgba(255,255,255,0.5);letter-spacing:0.12em;margin-bottom:30px;z-index:1}
.dv{width:80px;height:2px;background:#6366f1;border-radius:2px;margin-bottom:24px;z-index:1}
.tg{font-size:14px;color:rgba(255,255,255,0.3);letter-spacing:0.06em;z-index:1;text-align:center;padding:0 60px;word-break:break-all}
</style></head><body>
<div class="intro"><div class="glow"></div><div class="grid"></div>
<div class="ib"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></div>
<div class="h1">FunASR 语音识别工具包调研</div>
<div class="h2">2026-06-12</div>
<div class="dv"></div>
<div class="tg">https://github.com/modelscope/FunASR</div>
</div>
</body></html>
